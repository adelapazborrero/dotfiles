# kitty.conf — styled to match GNOME Ptyxis (dark, GNOME palette)
# Colors pulled straight from Ptyxis's bundled "gnome.palette" (Dark section).
# Font is the patched Nerd Font already installed on this system.

# ─── Font ──────────────────────────────────────────────────────────
# Exact family Ptyxis uses ("NotoSansM Nerd Font 11"), NOT the "Mono" variant.
# The Mono variant shrinks every icon into one narrow cell (tiny glyphs) and
# reads heavier; the plain family keeps icons at natural width, matching Ptyxis.
# The base glyphs are still fixed-width, so it works fine as a terminal font.
#
# Two things worth knowing (verified with kitty's own rasterizer):
#  * kitty only accepts a MONO-spaced face as the main font, so this line really
#    resolves to plain "Noto Sans Mono"; the icons come in via *fallback* to
#    NotoSansM Nerd Font. Same result, so leave it -- but don't switch to the
#    "Mono" variant or the icons get locked to one cell for good.
#  * kitty only draws a wide icon at natural size when the cells after it are
#    EMPTY. A tool that pads with U+2800 (braille blank) instead of a space --
#    logo-ls does -- keeps every icon boxed in one cell and scaled down, which
#    looks exactly like the Mono variant. VTE (Ptyxis) has no such rule, which
#    is why the same font looks right there. See ~/.local/bin/logo-ls-icons.
# bold/italic left on "auto" so kitty picks the right face from the same family.
font_family      NotoSansM Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# ─── Cursor ────────────────────────────────────────────────────────
cursor_shape block
cursor_text_color background

# ─── Scrollback / bell ─────────────────────────────────────────────
scrollback_lines 100000
enable_audio_bell yes
visual_bell_duration 0.15
confirm_os_window_close -1

# ─── Window ────────────────────────────────────────────────────────
# Matches Ptyxis's remembered window-size (154x43 cells) instead of kitty's
# small 80x24-ish default. remember_window_size stays on (default) so kitty
# then keeps whatever size you resize to, same as Ptyxis's restore-window-size.
initial_window_width  100c
initial_window_height 30c
remember_window_size yes
window_padding_width 6
background_opacity 0.9
hide_window_decorations no
# Native GNOME titlebar: kitty's Wayland backend draws its OWN (non-native)
# titlebar because it doesn't link libdecor. Running under XWayland instead lets
# GNOME/Mutter draw the real server-side Adwaita titlebar + window controls.
# This display is at 1x (no fractional scaling), so XWayland costs no sharpness.
linux_display_server x11

# ─── Tab bar (approximating GNOME's top tab style) ─────────────────
tab_bar_edge top
tab_bar_style slant
tab_bar_min_tabs 2

# ─── Color scheme: GNOME palette, Dark variant ──────────────────────
foreground            #ffffff
background            #1c1c1f
cursor                 #ffffff
selection_background  #3584e4
selection_foreground  #ffffff

# Active/inactive tab colors to echo the GNOME titlebar tones
active_tab_background   #2e2e32
active_tab_foreground   #ffffff
inactive_tab_background #1c1c1f
inactive_tab_foreground #c0bfbc

# black
color0  #241f31
color8  #5e5c64
# red
color1  #c01c28
color9  #ed333b
# green
color2  #2ec27e
color10 #57e389
# yellow
color3  #f5c211
color11 #f8e45c
# blue
color4  #1e78e4
color12 #51a1ff
# magenta
color5  #9841bb
color13 #c061cb
# cyan
color6  #0ab9dc
color14 #4fd2fd
# white
color7  #c0bfbc
color15 #f6f5f4

# ─── Misc ──────────────────────────────────────────────────────────
# no-cursor: keep shell integration (cwd reporting, prompt marks, etc.) but
# STOP it from forcing a blinking bar cursor at the zsh prompt. Without this,
# kitty's integration overrides "cursor_shape block" above and you get a │.
shell_integration enabled no-cursor
allow_remote_control no
